name: Landmine Game
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    run_landmine:
        runs-on: ubuntu-latest
        steps:
            - name: Download Code
              uses: actions/checkout@v3
            - name: Install Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "24"
            - name: Install Dependencies
              run: npm install
            - name: Install TypeScript
              run: npm install -g typescript
            - name: Run tsc
              run: tsc landmine.ts
            - name: Run tsc
              run: tsc --noEmit landmine.ts
